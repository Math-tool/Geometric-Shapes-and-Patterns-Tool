                    resultDisplayDiv.innerHTML += `<p><strong>${resultKey}:</strong> ${isNaN(resultVal) ? getTranslate('cannotSolve') : `${formatNumber(resultVal)} ${unit}`}<br><small>${isNaN(resultVal) ? '' : `(${getTranslate('calculationSteps')} ${calcStepsDisplay})`}</small></p>`;

                } else { // mode === 'calc_perimeter'
                    formulaStr = shapeDef.perimeterFormula(currentLang); // Get the formula string
                    unit = getTranslate('cm'); // Units for perimeter
                    resultKey = getTranslate('perimeter'); // Key for result label
                    try {
                        resultVal = shapeDef.getPerimeter(inputDims); // Calculate the perimeter
                        if (isNaN(resultVal)) throw new Error("Calculation resulted in NaN"); // Check for calculation errors
                        // Format steps for display
                        calcStepsDisplay = formatCalcStepsDisplay(formulaStr, inputDims) + ` = ${formatNumber(resultVal)}`;
                    } catch (e) {
                        console.error("Perimeter calculation error:", e);
                        resultVal = NaN;
                    }
                    formulaDisplayDiv.innerHTML = `<p><strong>${getTranslate('perimeterFormula')}:</strong> ${formulaStr}</p>`; // Display the base formula
                     // Display the result or 'cannot solve' message
                    resultDisplayDiv.innerHTML += `<p><strong>${resultKey}:</strong> ${isNaN(resultVal) ? getTranslate('cannotSolve') : `${formatNumber(resultVal)} ${unit}`}<br><small>${isNaN(resultVal) ? '' : `(${getTranslate('calculationSteps')} ${calcStepsDisplay})`}</small></p>`;
                }

            // --- Mode 3: Find Missing Dimension ---
            } else { // mode === 'find_dimension'
                const metric = knownMetricSelect.value; // 'area' or 'perimeter'
                const metricVal = parseFloat(knownMetricValueInput.value); // Value of the known metric
                const knownDim = knownDimensionNameSelect.value; // Key of the other known dimension (if applicable)
                // Get value of the other known dimension only if the dropdown is enabled
                const knownDimVal = knownDimensionNameSelect.disabled ? null : parseFloat(knownDimensionValueInput.value);

                // --- Validate Inputs for Find Dimension ---
                knownMetricValueInput.style.borderColor = ''; // Reset validation styles
                knownDimensionValueInput.style.borderColor = '';
                let findError = false;
                // Check known metric value
                if (isNaN(metricVal) || metricVal <= 0) {
                    knownMetricValueInput.style.borderColor = 'red';
                    findError = true;
                }
                // Check known dimension value *only if* it's required (select is enabled)
                if (!knownDimensionNameSelect.disabled && (isNaN(knownDimVal) || knownDimVal <= 0)) {
                    knownDimensionValueInput.style.borderColor = 'red';
                    findError = true;
                }
                // Show error and exit if validation fails
                if (findError) {
                    resultDisplayDiv.textContent = getTranslate('valueMissing');
                    return;
                }

                // Display the relevant base formula (area or perimeter)
                const baseFormulaStr = metric === 'area' ? shapeDef.areaFormula(currentLang) : shapeDef.perimeterFormula(currentLang);
                formulaDisplayDiv.innerHTML = `<p><strong>${getTranslate(metric === 'area' ? 'areaFormula' : 'perimeterFormula')}:</strong> ${baseFormulaStr}</p>`;

                // --- Attempt to find the missing dimension using the shape's findDim function ---
                const result = shapeDef.findDim(metric, metricVal, knownDim, knownDimVal, currentLang);

                // --- Display Result or Error ---
                if (result.error) { // If findDim returned an error message
                    resultDisplayDiv.textContent = result.error;
                } else { // If findDim returned the result successfully
                    // Construct the result string using translations
                    const resultText = getTranslate('missingDimensionResult')
                                         .replace('{dim}', result.dim) // Name of the found dimension
                                         .replace('{value}', result.value) // Calculated value
                                         .replace('{unit}', getTranslate('cm')); // Unit
                    resultDisplayDiv.innerHTML = `<p>${resultText}</p>`;
                    // Display calculation steps if provided by findDim
                    if (result.steps && result.steps.length > 0) {
                         // Format steps for display (replace symbols)
                         const formattedSteps = result.steps.map(step => step.replace(/\*/g, multiplySymbol).replace(/π/g, '3.14...').replace(/\^2/g, '²'));
                         resultDisplayDiv.innerHTML += `<small>(${getTranslate('calculationSteps')} ${formattedSteps.join('; ')})</small>`;
                    }
                }
            }
        });


        // --- Pattern Logic ---

        /**
         * Adds a shape (type and color) to a specific pattern slot.
         * @param {HTMLElement} slotElement - The pattern slot DOM element.
         * @param {string} shapeType - The type of shape (e.g., 'square').
         * @param {string} [color='#475569'] - The fill color of the shape.
         */
        function addShapeToPatternSlot(slotElement, shapeType, color = '#475569') {
            clearSlot(slotElement, false); // Clear previous content without updating sequence yet

            // Find the corresponding toolbar shape to clone its SVG
            const toolbarShape = shapeToolbar.querySelector(`.toolbar-shape[data-shape-type="${shapeType}"]`);
            if (toolbarShape && toolbarShape.querySelector('svg')) {
                const svgClone = toolbarShape.querySelector('svg').cloneNode(true);
                svgClone.setAttribute('fill', color); // *** Apply the specific color ***
                slotElement.appendChild(svgClone); // Add SVG to the slot
            }

            // Add a remove button ('x') to the slot
            const removeBtn = document.createElement('span');
            removeBtn.classList.add('remove-btn');
            removeBtn.innerHTML = '&times;'; // Simple 'x' symbol
            removeBtn.title = `Remove ${shapeType}`; // Tooltip for accessibility
            // Click handler for the remove button
            removeBtn.onclick = (e) => {
                e.stopPropagation(); // Prevent event bubbling
                clearSlot(slotElement); // Clear this specific slot and update sequence
                showFeedback('feedbackShapeRemoved', 'success', 1500); // Show feedback message
            };
            slotElement.appendChild(removeBtn); // Add button to the slot

            // *** Store both shape type and color in the slot's dataset ***
            slotElement.dataset.shapeType = shapeType;
            slotElement.dataset.shapeColor = color; // Store the color

            updatePatternSequence(); // Update the internal pattern sequence array
        }

        /**
         * Clears the content (SVG, button, data) of a pattern slot.
         * @param {HTMLElement} slotElement - The pattern slot element to clear.
         * @param {boolean} [updateSeq=true] - Whether to update the patternSequence array afterwards.
         */
        function clearSlot(slotElement, updateSeq = true) {
             slotElement.innerHTML = ''; // Remove SVG and button
             delete slotElement.dataset.shapeType; // Remove shape type data
             delete slotElement.dataset.shapeColor; // *** Remove shape color data ***
             if (updateSeq) {
                 updatePatternSequence(); // Update sequence if requested (usually true)
             }
        }

        /**
         * Updates the `patternSequence` array based on the current state of the pattern slots.
         * Each item in the array is either null or an object {type, color}.
         */
        function updatePatternSequence() {
            patternSequence = []; // Reset the sequence array
            // Select ALL pattern slots again within this function to get the updated list
            const currentPatternSlots = patternBar.querySelectorAll('.pattern-slot');
            currentPatternSlots.forEach(slot => {
                // *** If slot has both shape type and color, push an object, else push null ***
                if (slot.dataset.shapeType && slot.dataset.shapeColor) {
                    patternSequence.push({
                        type: slot.dataset.shapeType,
                        color: slot.dataset.shapeColor // Include color in the sequence item
                    });
                } else {
                    patternSequence.push(null); // Represent empty slot as null
                }
            });
            // console.log("Updated Pattern Sequence:", JSON.stringify(patternSequence)); // For debugging
            updatePatternCheckButton(); // Update the enabled/disabled state of the check button
        }

        /**
         * Enables or disables the 'Check Pattern' button based on whether the pattern bar is empty.
         */
        function updatePatternCheckButton() {
             // Check if every item in the sequence is null (i.e., pattern bar is empty)
             const isEmpty = patternSequence.every(s => s === null);
             checkPatternButton.disabled = isEmpty; // Disable button if empty
             // Adjust visual style for disabled state (handled by CSS .btn:disabled)
        }

        // --- Pattern Button Event Listeners ---

        /**
         * Checks if the current sequence in the pattern bar forms a valid repeating pattern.
         * Considers both shape type and color.
         */
        checkPatternButton.addEventListener('click', () => {
            // *** Filter out nulls to get the actual pattern items (objects with type and color) ***
            const currentPattern = patternSequence.filter(s => s !== null);

            // Need at least two items to potentially form a repeating pattern
            if (currentPattern.length < 2) {
                showFeedback('feedbackPatternIncorrect', 'error');
                return;
            }

            let isRepeating = false;
            // Iterate through possible sub-pattern lengths (from 1 up to half the total length)
            for (let len = 1; len <= Math.floor(currentPattern.length / 2); len++) {
                // Only check lengths that divide the total pattern length evenly
                if (currentPattern.length % len === 0) {
                    const subPattern = currentPattern.slice(0, len); // The potential repeating unit
                    let repeats = true; // Assume it repeats initially
                    // Check subsequent segments against the first sub-pattern
                    for (let i = len; i < currentPattern.length; i += len) {
                        const nextSegment = currentPattern.slice(i, i + len);
                        // *** Compare segments using JSON.stringify for deep comparison of objects (type and color) ***
                        if (JSON.stringify(nextSegment) !== JSON.stringify(subPattern)) {
                            repeats = false; // Mismatch found
                            break; // No need to check further for this length
                        }
                    }
                    // If all segments matched the sub-pattern
                    if (repeats) {
                        isRepeating = true;
                        break; // Found a valid repeating pattern, exit the loop
                    }
                }
            }

            // Show feedback based on whether a repeating pattern was found
            showFeedback(isRepeating ? 'feedbackPatternCorrect' : 'feedbackPatternIncorrect', isRepeating ? 'success' : 'error');
        });

        /**
         * Clears all shapes from the pattern bar.
         */
        clearPatternButton.addEventListener('click', () => {
             // Select ALL pattern slots again within this function to clear the updated list
             const currentPatternSlots = patternBar.querySelectorAll('.pattern-slot');
             currentPatternSlots.forEach(slot => clearSlot(slot, false)); // Clear all slots without updating sequence individually
             updatePatternSequence(); // Update sequence once after clearing all slots
        });

        // --- Toolbar Color Selection Logic ---

        /**
         * Populates the color palette swatches for all toolbar shapes.
         */
        function populateAllToolbarPalettes() {
             document.querySelectorAll('.toolbar-shape-container').forEach(container => {
                 const paletteDiv = container.querySelector('.toolbar-color-palette');
                 if (!paletteDiv) return; // Skip if palette div not found
                 paletteDiv.innerHTML = ''; // Clear existing swatches
                 // Create a swatch for each available color
                 availableToolbarColors.forEach(color => {
                     const swatch = document.createElement('div');
                     swatch.classList.add('toolbar-color-swatch');
                     swatch.style.backgroundColor = color; // Set swatch background
                     swatch.dataset.color = color; // Store color value on the swatch
                     // Add click listener to handle color selection
                     swatch.addEventListener('click', handleToolbarColorChange);
                     paletteDiv.appendChild(swatch); // Add swatch to the palette
                 });
             });
        }

        /**
         * Handles clicks on toolbar shape containers to show/hide the color palette.
         * @param {Event} event - The click event.
         */
        function handleToolbarShapeClick(event) {
             // Ignore clicks originating from the color swatches themselves
             if (event.target.classList.contains('toolbar-color-swatch')) return;

             const currentContainer = event.currentTarget; // The .toolbar-shape-container that was clicked
             const wasActive = currentContainer.classList.contains('show-palette'); // Check if palette was already showing

             hideAllToolbarPalettes(); // Hide any other open palettes first

             // If the clicked palette wasn't already active, show it
             if (!wasActive) {
                 currentContainer.classList.add('show-palette'); // Show the palette div
                 currentContainer.querySelector('.toolbar-shape').classList.add('palette-active'); // Add highlight border to shape
             }
             // If it was active, hideAllToolbarPalettes already handled hiding it.
             event.stopPropagation(); // Prevent the body click listener from hiding it immediately
        }

        /**
         * Handles clicks on color swatches in the toolbar palettes.
         * Updates the fill color of the corresponding toolbar shape's SVG.
         * @param {Event} event - The click event.
         */
        function handleToolbarColorChange(event) {
             const swatch = event.currentTarget; // The color swatch that was clicked
             const newColor = swatch.dataset.color; // Get the color from the swatch's data
             const container = swatch.closest('.toolbar-shape-container'); // Find the parent container

             if (container) {
                 const svg = container.querySelector('.toolbar-shape svg'); // Find the SVG within the container
                 if (svg) {
                     svg.setAttribute('fill', newColor); // Update the SVG's fill color
                 }
                 hideAllToolbarPalettes(); // Hide the palette after selection
             }
             event.stopPropagation(); // Prevent the container click listener from firing
        }

        /**
         * Hides all currently visible toolbar color palettes.
         */
        function hideAllToolbarPalettes() {
            document.querySelectorAll('.toolbar-shape-container.show-palette').forEach(container => {
                container.classList.remove('show-palette'); // Hide palette div
                container.querySelector('.toolbar-shape').classList.remove('palette-active'); // Remove border highlight
            });
        }

        // --- Toolbar Event Listeners ---

        // Add click listeners to each toolbar shape container to toggle its palette
        document.querySelectorAll('.toolbar-shape-container').forEach(container => {
            container.addEventListener('click', handleToolbarShapeClick);
        });

        // Add listener to the body to hide palettes when clicking anywhere outside the toolbar
        document.body.addEventListener('click', (event) => {
            // Check if the click target is outside the #shape-toolbar element
            if (!event.target.closest('#shape-toolbar')) {
                hideAllToolbarPalettes();
            }
        });


        // --- Initialization ---
        // Function to run when the page loads
        function initializeApp() {
            langToggleButton.addEventListener('click', toggleLanguage); // Setup language toggle
            currentLang = 'en'; // Set default language
            htmlElement.lang = currentLang;
            htmlElement.dir = 'ltr'; // Set default direction

            populateAllToolbarPalettes(); // Create color swatches
            applyTranslations(currentLang); // Apply initial translations
            resetCalculatorUI(); // Set initial calculator state
            updatePatternSequence(); // Initialize pattern sequence and button state

            // Re-enable interact dropzone for newly added slots if necessary
            // (InteractJS might need re-initialization if slots are added dynamically *after* initial setup)
            // However, since we add them directly in HTML, the initial setup should catch them.
            // If slots were added *programmatically* after load, you might need:
            // interact('.pattern-slot').dropzone({...}); // Re-apply dropzone settings
        }

        // Run initialization code when the DOM is fully loaded
        document.addEventListener('DOMContentLoaded', initializeApp);

    </script>
